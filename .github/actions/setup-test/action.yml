name: Setup test environment
description: Checkout lua-yar, install OpenResty and test-nginx, setup LUA_PATH

inputs:
  install-test-nginx:
    description: Whether to install Test::Nginx (needed for prove-based tests)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout lua-yar
      uses: actions/checkout@v4
      with:
        repository: fangfengxiang/lua-yar
        path: lua-yar

    - name: Install OpenResty
      shell: bash
      run: |
        wget -qO - https://openresty.org/package/pubkey.gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/openresty.gpg
        codename=$(lsb_release -sc)
        echo "deb [signed-by=/usr/share/keyrings/openresty.gpg] http://openresty.org/package/ubuntu $codename main" \
          | sudo tee /etc/apt/sources.list.d/openresty.list
        sudo apt-get update -qq
        sudo apt-get install -y -qq openresty openresty-opm

    - name: Install test-nginx
      if: inputs.install-test-nginx == 'true'
      shell: bash
      run: |
        sudo apt-get install -y -qq cpanminus
        sudo cpanm --notest Test::Nginx

    - name: Setup paths
      shell: bash
      run: |
        echo "/usr/local/openresty/bin" >> $GITHUB_PATH
        echo "/usr/local/openresty/nginx/sbin" >> $GITHUB_PATH
        echo "LUA_PATH=$PWD/lib/?.lua;$PWD/lib/?/init.lua;$PWD/lua-yar/src/?.lua;$PWD/lua-yar/src/?/init.lua;;" >> $GITHUB_ENV
