site_name: lua-resty-yar
site_url: https://fangfengxiang.github.io/lua-resty-yar/
site_description: High-performance Yar RPC server for OpenResty, built on lua-yar
repo_url: https://github.com/fangfengxiang/lua-resty-yar
repo_name: fangfengxiang/lua-resty-yar
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Reference:
      - API Reference: api.md
      - Positioning: positioning.md
  - Design:
      - ADR Index: design/decisions.md
      - Adaptation Layer: design/adaptation-layer.md
      - Configuration Bridge: design/configuration-bridge.md
      - Handler Delegation: design/handler-delegation.md
      - Observability Integration: design/observability-integration.md
  - Reports:
      - Evaluation Report: reports/evaluation-report.md
      - Kong-Inspired Optimization: reports/kong-inspired-optimization.md
      - Multi-Stage Evaluation: reports/multi-stage-evaluation.md
      - Optimization Plan 0.1.0: reports/optimization-plan-0.1.0.md
      - Reevaluation 0.1.0: reports/reevaluation-0.1.0.md
      - Restructuring Review: reports/restructuring-review.md
      - Code Review 2026-07-10: reports/code-review-2026-07-10.md
      - Dependency Audit: reports/dependency-audit.md
      - Lua-Yar Pool Param Refactor: reports/lua-yar-pool-param-refactor.md
