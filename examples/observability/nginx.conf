worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # From examples/observability/ → ../../lib = lib/, ../../../lua-yar = sibling lua-yar
    lua_package_path "../../lib/?.lua;../../../lua-yar/src/?.lua;;";

    # Shared dict for Prometheus metrics
    lua_shared_dict yar_metrics 1m;

    init_by_lua_block {
        local yar = require("resty.yar")
        local obs = require("resty.yar.observability")

        -- 手动创建 metrics hooks 保留 export 引用：
        -- defaults() 经 compose_named 只转发 6 种 hook 类型，丢失 export 字段。
        local metrics = obs.metrics_recorder({
            dict_name = "yar_metrics",
            prefix = "yar",
            buffer_enabled = true,
            flush_interval = 1,
        })

        yar.setup {
            server = {
                service = {
                    add = function(a, b) return a + b end,
                    slow = function()
                        ngx.sleep(0.1)  -- Simulate slow operation
                        return "done"
                    end,
                },
                packager = "JSON",
                timeout = 5000,
            },
            hooks = obs.compose(
                obs.trace_middleware({ header = "X-Request-Id" }),
                obs.access_logger({ defer = true }),
                metrics
            ),
        }

        -- Store export function for /metrics endpoint
        _G.export_metrics = metrics.export
    }

    server {
        listen 8080;

        location / {
            return 200 "lua-resty-yar observability example. POST to /rpc, GET /metrics";
        }

        location /rpc {
            content_by_lua_block {
                require("resty.yar.server.http").serve()
            }
        }

        # Prometheus metrics endpoint
        location /metrics {
            default_type text/plain;
            content_by_lua_block {
                ngx.print(_G.export_metrics())
            }
        }

        # Health check with request ID
        location /health {
            content_by_lua_block {
                local obs = require("resty.yar.observability")
                local rid = obs.get_request_id()
                ngx.say("OK — request_id=" .. rid)
            }
        }
    }

    # Deferred access log flushing (runs in log_by_lua phase)
    log_by_lua_block {
        require("resty.yar.observability").flush_logs()
    }
}
