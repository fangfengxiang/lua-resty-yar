worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    lua_package_path "../../lib/?.lua;../../../lua-yar/src/?.lua;;";

    init_by_lua_block {
        local yar = require("resty.yar")

        yar.setup {
            client = {
                timeout = 3000,
                connect_timeout = 1000,
                pool_size = 30,
                keepalive_idle = 60000,
            },
        }
    }

    server {
        listen 8080;

        location /call {
            content_by_lua_block {
                local yar = require("resty.yar")

                -- Get a persistent client (socket reused across calls)
                local client = yar.get_client("http://127.0.0.1:9999/rpc")

                -- First call (establishes connection)
                local r1, err1 = client:call("add", { 1, 2 })
                if err1 then
                    ngx.status = 500
                    ngx.say("RPC failed: " .. tostring(err1))
                    return
                end
                ngx.say("add(1, 2) = " .. tostring(r1))

                -- Second call (reuses connection — keepalive)
                local r2, err2 = client:call("add", { 10, 20 })
                if err2 then
                    ngx.status = 500
                    ngx.say("RPC failed: " .. tostring(err2))
                    return
                end
                ngx.say("add(10, 20) = " .. tostring(r2))
            }
        }

        location /call_tcp {
            content_by_lua_block {
                local yar = require("resty.yar")

                -- TCP client
                local client = yar.get_client("tcp://127.0.0.1:9999")
                local result, err = client:call("echo", { "hello" })

                if err then
                    ngx.status = 500
                    ngx.say("RPC failed: " .. tostring(err))
                    return
                end
                ngx.say("echo result: " .. tostring(result))
            }
        }
    }
}
