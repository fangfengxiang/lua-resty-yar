worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

# TCP stream server (requires ngx_stream_lua_module)
# From examples/tcp-server/ → ../../lib = lib/, ../../../lua-yar = sibling lua-yar
stream {
    lua_package_path "../../lib/?.lua;../../../lua-yar/src/?.lua;;";

    init_by_lua_block {
        local yar = require("resty.yar")

        yar.setup {
            server = {
                service = {
                    add = function(a, b) return a + b end,
                    echo = function(msg) return msg end,
                },
                packager = "JSON",
                timeout = 5000,
            },
        }
    }

    server {
        listen 9999;

        content_by_lua_block {
            require("resty.yar.server.tcp").serve()
        }
    }
}
