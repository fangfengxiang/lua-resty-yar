worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Adjust paths to match your directory layout
    # From examples/http-server/ → ../../lib = lib/, ../../../lua-yar = sibling lua-yar
    lua_package_path "../../lib/?.lua;../../../lua-yar/src/?.lua;./?.lua;;";

    init_by_lua_block {
        local yar = require("resty.yar")

        -- Inline service (was examples/http-server/service.lua)
        local service = {
            add = function(a, b) return a + b end,
            subtract = function(a, b) return a - b end,
            multiply = function(a, b) return a * b end,
            divide = function(a, b)
                if b == 0 then error("division by zero") end
                return a / b
            end,
            echo = function(msg) return msg end,
            greet = function(name) return "Hello, " .. name .. "!" end,
        }

        yar.setup {
            server = {
                service = service,
                packager = "JSON",
                timeout = 5000,
                max_body_len = 10485760,
            },
        }
    }

    server {
        listen 8080;

        location / {
            return 200 "lua-resty-yar HTTP server. POST to /rpc for Yar RPC.";
        }

        location /health {
            return 200 "OK";
        }

        location /rpc {
            content_by_lua_block {
                require("resty.yar.server.http").serve()
            }
        }
    }
}
