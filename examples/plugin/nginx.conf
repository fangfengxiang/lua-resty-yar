worker_processes 1;
error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # From examples/plugin/ → ../../lib = lib/, ../../../lua-yar = sibling lua-yar
    lua_package_path "../../lib/?.lua;../../../lua-yar/src/?.lua;./?.lua;;";

    lua_shared_dict rate_limit_dict 1m;

    init_by_lua_block {
        local yar = require("resty.yar")
        local obs = require("resty.yar.observability")

        -- Inline rate-limit plugin (was examples/plugin/rate_limit.lua)
        local MAX_REQUESTS = 100  -- Max calls per second per method
        yar.register("rate-limit", function()
            local dict = ngx.shared.rate_limit_dict
            return {
                on_request = function(method, _params)
                    local key = method .. ":" .. os.date("%Y%m%d%H%M%S")
                    local count = dict:incr(key, 1, 0)
                    if count > MAX_REQUESTS then
                        ngx.ctx.yar_rate_limited = true
                        ngx.ctx.yar_rate_limit_count = count
                    end
                end,
                on_response = function(method, _retval, err_obj)
                    if ngx.ctx.yar_rate_limited then
                        ngx.log(ngx.WARN, "[rate-limit] " .. method .. " exceeded limit (count="
                            .. tostring(ngx.ctx.yar_rate_limit_count) .. ")")
                    elseif not err_obj then
                        ngx.log(ngx.DEBUG, "[rate-limit] " .. method .. " ok")
                    end
                end,
            }
        end, { priority = 75 })  -- Between trace (50) and access-log (100)

        yar.setup {
            server = {
                service = {
                    add = function(a, b) return a + b end,
                    echo = function(msg) return msg end,
                },
                packager = "JSON",
                timeout = 5000,
            },
            -- Inline hooks compose with registered plugins
            hooks = obs.defaults(),
        }
    }

    server {
        listen 8080;

        location / {
            return 200 "lua-resty-yar plugin example. POST to /rpc (rate-limited: 100 req/s/method)";
        }

        location /rpc {
            content_by_lua_block {
                require("resty.yar.server.http").serve()
            }
        }
    }
}
